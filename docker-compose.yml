# Telecom platform - local services that are specific to this project.
#
# Azure stand-ins (Azurite, Event Hubs emulator, Grafana LGTM) come from the shared
# azure-local-lab stack so every project uses the same emulators:
#
#   (cd ../azure-local-lab && docker compose --profile streaming up -d)
#   docker compose up -d          # Marquez: OpenLineage backend + lineage graph UI
#
# Then run with lineage going to Marquez instead of the JSONL file:
#   OPENLINEAGE_URL=http://localhost:5000 uv run python -m lakehouse --stream
#   open http://localhost:3002  (namespace: telecom-platform)
#
# Marquez plays the role Microsoft Purview plays in Azure: both consume OpenLineage.

name: telecom-platform

services:
  marquez-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez # the marquez image hard-codes this default; local-only
      POSTGRES_DB: marquez
    volumes: ["marquez-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      retries: 20

  marquez:
    image: marquezproject/marquez:0.50.0
    depends_on:
      marquez-db: { condition: service_healthy }
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez # the marquez image hard-codes this default; local-only
    ports: ["${MARQUEZ_API_PORT:-5000}:5000", "${MARQUEZ_ADMIN_PORT:-5001}:5001"]

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    depends_on: [marquez]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports: ["${MARQUEZ_WEB_PORT:-3002}:3000"]

volumes:
  marquez-db:
