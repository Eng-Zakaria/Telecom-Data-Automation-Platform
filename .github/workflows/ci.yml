name: ci

on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch: # run on demand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The project depends on cloudkit from azure-local-lab (path dependency ../azure-local-lab),
# so both repos are checked out side by side.
env:
  LAB_REPO: ${{ vars.LAB_REPO || 'Eng-Zakaria/azure-local-lab' }}

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: telecom } }
    steps:
      - uses: actions/checkout@v4
        with: { path: telecom }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.LAB_REPO }}", path: azure-local-lab }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dbt
      - name: dbt project parses (refs, sources, tests resolve)
        working-directory: telecom/transform/dbt
        run: uv run --project ../.. dbt parse --profiles-dir .
      - name: ruff (new code is held to the bar; legacy modules are tracked in BACKLOG)
        run: uv run ruff check lakehouse scripts tests/test_lakehouse_quality.py tests/test_lakehouse_integration.py
      - run: uv run pytest --cov=lakehouse --cov=ingestion --cov-report=term-missing:skip-covered

  integration:
    name: pipeline against Azure emulators
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with: { path: telecom }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.LAB_REPO }}", path: azure-local-lab }
      - uses: astral-sh/setup-uv@v5
      - name: start Azurite, Event Hubs emulator, Grafana LGTM
        working-directory: azure-local-lab
        run: |
          ./scripts/init-env.sh
          docker compose --profile streaming up -d --wait azurite observability
          docker compose --profile streaming up -d eventhubs
          timeout 150 bash -c 'until curl -sf localhost:5300/health; do sleep 3; done'
      - name: start Marquez (lineage backend)
        working-directory: telecom
        run: |
          docker compose up -d
          timeout 180 bash -c 'until curl -sf localhost:5000/api/v1/namespaces; do sleep 4; done'
      - working-directory: telecom
        run: uv sync --extra dbt
      - name: integration tests
        working-directory: telecom
        run: uv run pytest -m integration -v
      - name: full run - streamed, contracts, dbt build + tests, gold publish, lineage to Marquez
        working-directory: telecom
        env: { OPENLINEAGE_URL: "http://localhost:5000" }
        run: uv run python -m lakehouse --cdr 5000 --chaos 0.02 --stream --dbt --prefix ci/${{ github.run_id }}
      - name: lineage graph is complete
        working-directory: telecom
        run: uv run python scripts/check_lineage.py --marquez http://localhost:5000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-artifacts
          path: telecom/artifacts/
      - if: failure()
        working-directory: azure-local-lab
        run: docker compose --profile streaming logs --tail 80
