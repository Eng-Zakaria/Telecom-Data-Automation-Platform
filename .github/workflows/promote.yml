name: promote

# main -> staging automatically; staging -> prod behind the `prod` environment's
# required reviewers. The plan that was reviewed is the plan that is applied.

on:
  push:
    branches: [main, master]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  FABRIC_USE_OIDC: "true"
  FABRIC_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  FABRIC_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    if: vars.AZURE_CLIENT_ID != ''
    strategy:
      max-parallel: 1
      matrix:
        env: [staging, prod] # sequential: prod only after staging succeeds
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    defaults: { run: { working-directory: "telecom/infra/environments/${{ matrix.env }}" } }
    steps:
      - uses: actions/checkout@v4
        with: { path: telecom }
      - uses: actions/checkout@v4 # cloudkit (path dependency ../azure-local-lab)
        with: { repository: "${{ vars.LAB_REPO || 'Eng-Zakaria/azure-local-lab' }}", path: azure-local-lab }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8", terraform_wrapper: false }
      - run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.env }}.tfstate"
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - run: terraform apply -input=false tfplan
      - name: smoke test against the deployed environment
        working-directory: telecom
        run: |
          eval "$(terraform -chdir=infra/environments/${{ matrix.env }} output -json cloudkit_env \
            | python3 -c 'import sys,json; [print(f"export {k}={v}") for k,v in json.load(sys.stdin).items()]')"
          pip install uv && uv sync
          LAKE_PREFIX=smoke/${{ github.run_id }} uv run python -m lakehouse --cdr 500 --customers 50 --towers 5 --days 1
