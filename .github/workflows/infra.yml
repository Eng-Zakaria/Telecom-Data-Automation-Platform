name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main, master]
    paths: ["infra/**"]

permissions:
  contents: read
  id-token: write # GitHub OIDC -> Entra ID federated credential, no client secret
  pull-requests: write

jobs:
  static:
    name: fmt / validate / tflint / checkov
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod, ephemeral]
    defaults: { run: { working-directory: "infra/environments/${{ matrix.env }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive --chdir=../..
      - name: checkov (policy as code)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          config_file: infra/.checkov.yml

  plan:
    name: plan (${{ matrix.env }})
    needs: static
    if: ${{ github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    defaults: { run: { working-directory: "infra/environments/${{ matrix.env }}" } }
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      FABRIC_USE_OIDC: "true"
      FABRIC_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      FABRIC_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - name: init (remote state, Entra ID auth)
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.env }}.tfstate"
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan -no-color | tee plan.txt
      - name: cost estimate
        if: ${{ vars.INFRACOST_ENABLED == 'true' }}
        uses: infracost/actions/setup@v3
        with: { api-key: "${{ secrets.INFRACOST_API_KEY }}" }
      - if: ${{ vars.INFRACOST_ENABLED == 'true' }}
        run: infracost breakdown --path . --format table | tee -a plan.txt
      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/${{ matrix.env }}/plan.txt', 'utf8');
            const body = `### terraform plan: \`${{ matrix.env }}\`\n<details><summary>show</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
